# Runs the scrape on a schedule so the timeline keeps filling up with
# fresh news even when nobody clicks "Refresh data" in the UI.
#
# It simply calls the deployed API's trigger endpoint.
# Set the repository secret API_URL to your deployed backend URL first
# (Settings -> Secrets and variables -> Actions).

name: Scheduled scrape

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: # also allows running it manually from the Actions tab

jobs:
  trigger-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the ingest pipeline
        run: curl -fsS -X POST "${{ secrets.API_URL }}/ingest/trigger"
