services:
  - type: web
    name: news-pulse-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && pip3 install -r ../scraper/requirements.txt
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      - key: DB_PATH
        value: ../news_pulse.db
      - key: PYTHON_BIN
        value: python3
      - key: SCRAPER_DIR
        value: ../scraper
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: news-pulse-frontend
          envVarKey: RENDER_EXTERNAL_URL
  - type: web
    name: news-pulse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: news-pulse-api
          envVarKey: RENDER_EXTERNAL_URL