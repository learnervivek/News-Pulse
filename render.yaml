# Render deployment config for the backend API + Python scraper.
# Render reads this file automatically when you connect the repo.

services:
  - type: web
    name: news-pulse-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 4000
      - key: DB_PATH
        value: ../news_pulse.db
      - key: PYTHON_BIN
        value: python3
      - key: SCRAPER_DIR
        value: ../scraper
      - key: SCRAPER_SCRIPT
        value: main.py
      # Set this to your deployed frontend URL once Vercel gives you one.
      - key: CORS_ORIGIN
        value: "*"
